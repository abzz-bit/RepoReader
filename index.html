<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepoRadar — Explore public GitHub projects</title><link rel="stylesheet" href="styles.css"><script defer src="core.js"></script><script defer src="app.js"></script></head><body><main><header><span class="badge">PUBLIC REPOSITORY EXPLORER</span><h1>Repo<span>Radar</span></h1><p>Discover the code behind any GitHub profile.</p></header><form id="search"><label for="username">GitHub username</label><div class="search-row"><input id="username" name="username" placeholder="e.g. octocat" required maxlength="39" autocomplete="off" spellcheck="false"><button id="load">Explore repositories</button></div></form><section class="toolbar" aria-label="Repository controls"><div><label for="language">Language</label><select id="language"><option value="">All languages</option></select></div><div><label for="sort">Sort by</label><select id="sort"><option value="updated">Recently updated</option><option value="stars">Most stars</option><option value="forks">Most forks</option><option value="name">Name A–Z</option></select></div><label class="check"><input type="checkbox" id="hide-forks"> Hide forked repositories</label><button id="refresh" type="button" disabled>Refresh from GitHub</button></section><p id="status" role="status" aria-live="polite">Search a username to get started, or try the sample below.</p><div id="summary" class="summary"></div><section id="repos" class="grid" aria-label="Repository results"></section><footer><button type="button" id="demo">Try offline demo</button><p>No sign-in. No tokens. Public data only. Cached on this device for 10 minutes.</p></footer></main></body></html>
